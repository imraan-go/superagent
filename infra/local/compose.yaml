# Local development infrastructure. All ports bind to 127.0.0.1 only; data lives in named volumes.
# `pnpm infra:stop` stops containers and keeps data. `docker compose down -v` (pnpm infra:reset)
# DELETES the volumes: it is a reset, not a normal stop.
name: superagent

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: superagent
      POSTGRES_DB: superagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superagent -d superagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO server (Chainguard-maintained build; the upstream minio/minio images are no longer published).
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?run pnpm setup:env first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?run pnpm setup:env first}
      MINIO_BROWSER_REDIRECT: "off"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
